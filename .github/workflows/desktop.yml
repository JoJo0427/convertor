# Builds the desktop app for macOS and Windows.
#
# The Windows installer cannot be produced on a Mac, and the macOS app cannot be
# produced on Windows. This is the only way to get both from one commit, and the
# only way anyone can verify the Windows build actually runs.

name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon
            target: aarch64-apple-darwin
            python: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-13          # Intel
            target: x86_64-apple-darwin
            python: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: x86_64-pc-windows-msvc
            bundles: msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A relocatable interpreter, so the app does not depend on a Python
      # being installed on the user's machine.
      - name: Fetch the Python runtime
        shell: bash
        run: |
          url=$(curl -s https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for a in d['assets']:
              n=a['name']
              if '3.12' in n and '${{ matrix.python }}' in n and n.endswith('install_only.tar.gz'):
                  print(a['browser_download_url']); break")
          mkdir -p desktop/runtime
          curl -sL "$url" -o /tmp/py.tar.gz
          tar xzf /tmp/py.tar.gz -C desktop/runtime --strip-components=1

      - name: Install the base tier
        shell: bash
        run: |
          py=desktop/runtime/bin/python3
          [ -f "$py" ] || py=desktop/runtime/python.exe
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -r engine/requirements-base.txt

      # The base tier's native engines. Everything heavier — LibreOffice,
      # Pandoc, Tesseract — is a pack the app fetches on demand.
      - name: Bundle the base engines (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg ghostscript librsvg potrace
          # Fails the build if any dependency is missing from the bundle, which
          # is the only thing standing between a Homebrew link and an app that
          # dies on first use. See R30 in TEST_PLAN.md.
          python3 desktop/bundle_binaries.py ffmpeg ffprobe gs rsvg-convert potrace

      - name: Bundle the base engines (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          # Windows builds are self-contained .exe files, so there is no
          # equivalent of the dylib relocation the macOS step does.
          curl -sL https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o /tmp/ff.zip
          unzip -q /tmp/ff.zip -d /tmp/ff
          find /tmp/ff -name 'ffmpeg.exe'  -exec cp {} desktop/src-tauri/binaries/ \;
          find /tmp/ff -name 'ffprobe.exe' -exec cp {} desktop/src-tauri/binaries/ \;

          # engines.py resolves by the Unix binary name plus ".exe", so each
          # file has to land under the name it looks for: Ghostscript ships as
          # gswin64c.exe and would never be found as "gs".
          choco install --no-progress -y ghostscript potrace
          gs=$(find /c/Program\ Files /c/ProgramData/chocolatey -name gswin64c.exe 2>/dev/null | head -1)
          [ -n "$gs" ] && cp "$gs" desktop/src-tauri/binaries/gs.exe
          pot=$(find /c/Program\ Files /c/ProgramData/chocolatey -name potrace.exe 2>/dev/null | head -1)
          [ -n "$pot" ] && cp "$pot" desktop/src-tauri/binaries/potrace.exe

          # librsvg has no standalone Windows build. MSYS2 is preinstalled on the
          # runner and packages it, but rsvg-convert.exe needs its DLLs beside
          # it, so the whole mingw64 bin directory's DLLs come along. Leaving
          # rsvg out would mean shipping a Windows app where every SVG
          # conversion fails — which is regression R14, on a new platform.
          /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-librsvg || true
          if [ -f /c/msys64/mingw64/bin/rsvg-convert.exe ]; then
            cp /c/msys64/mingw64/bin/rsvg-convert.exe desktop/src-tauri/binaries/
            cp /c/msys64/mingw64/bin/*.dll desktop/src-tauri/binaries/
          fi
          ls -la desktop/src-tauri/binaries/

      # Nothing above is allowed to fail silently: a base engine that did not
      # make it into the bundle must stop the build, not ship.
      - name: Check the base tier is complete
        shell: bash
        run: |
          cd desktop/src-tauri/binaries
          missing=""
          for b in ffmpeg ffprobe gs rsvg-convert potrace; do
            if [ ! -f "$b" ] && [ ! -f "$b.exe" ]; then missing="$missing $b"; fi
          done
          if [ -n "$missing" ]; then echo "missing base engines:$missing"; exit 1; fi
          echo "base tier complete"

      # The pip packs install from these lists at runtime. They are declared as
      # bundle resources, so a rename would fail the install rather than the
      # build — check them here, where it is cheap.
      - name: Check the pack requirements lists exist
        shell: bash
        run: |
          for f in requirements-pack-parquet.txt requirements-pack-pdfword.txt requirements-pack-ocr.txt; do
            test -f "engine/$f" || { echo "engine/$f is missing"; exit 1; }
          done
          echo "pack requirements present"

      - name: Build the interface
        run: npm --prefix web ci && npm --prefix web run build:desktop

      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # A checksum for every artefact. This is the part of code signing that
      # actually matters for a project handed out on GitHub: not "Apple vouches
      # for this developer", but "the file you downloaded is the file that was
      # built". It costs nothing.
      - name: Checksum the artefacts
        shell: bash
        run: |
          cd desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          for f in dmg/*.dmg msi/*.msi; do
            [ -f "$f" ] || continue
            if command -v shasum >/dev/null; then shasum -a 256 "$f" > "$f.sha256";
            else certutil -hashfile "$f" SHA256 > "$f.sha256"; fi
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: convertor-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sha256
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sha256

  # Publishing is a separate job so a release is only cut when every platform
  # built. A half-published release is worse than none.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Both are needed for build provenance, and both are free on a public repo.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect the artefacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.sha256' \) \
            -exec cp {} out/ \;
          ls -la out

      # Cryptographic proof that these files were built by this workflow from
      # this commit. It is not a substitute for Apple notarisation — Gatekeeper
      # does not read it — but it is the verifiable-origin guarantee that signing
      # would otherwise provide, and it is free. Anyone can check it with:
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/*.dmg, out/*.msi'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Installing

            These builds are **not signed** — this is a free project and Apple
            charges $99/year for the certificate that would silence the warning.
            Everything below is the free equivalent: you can verify exactly what
            you downloaded, you just have to tell your OS you meant it.

            **macOS.** Open the `.dmg`, drag Convertor to Applications, then launch
            it once from **System Settings → Privacy & Security → Open Anyway**.
            On macOS 15 and later that panel replaced the old right-click → Open.
            Apple silicon takes the `aarch64` build, Intel the `x86_64` one.

            **Windows.** Run the `.msi`. SmartScreen will interrupt: choose
            **More info → Run anyway**.

            ## Verifying what you downloaded

            Each file ships with a `.sha256`. Compare it:

            ```
            shasum -a 256 -c Convertor_1.0.0_aarch64.dmg.sha256
            ```

            Every build also carries GitHub build provenance, which proves it came
            from this repository and this commit:

            ```
            gh attestation verify Convertor_1.0.0_aarch64.dmg --repo ${{ github.repository }}
            ```
